name: Guard env/test Merges

# env/test has no deploy to gate, so this enforces authorization AFTER the fact:
# if a push/merge to env/test is made by someone who is not an authorized release
# manager, the change is automatically reverted and an alert issue is opened.
#
# Notes:
# - The revert push uses the built-in GITHUB_TOKEN, which does NOT re-trigger workflows,
#   so there is no loop.
# - If the revert cannot be applied cleanly (conflict), nothing is force-pushed; an issue
#   is opened asking for a manual revert instead.
# - This is honest-mistake prevention, not a hard block: anyone with write access can
#   disable this workflow. For a true block, use a Ruleset (paid on private repos).

on:
  push:
    branches:
      - env/test

permissions:
  contents: write
  issues: write

concurrency:
  group: guard-env-test
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the merge is by an authorized release manager
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const AUTHORIZED_MERGERS = [
              'smit9313',
            ];
            const actor = context.actor.toLowerCase();
            const authorized = AUTHORIZED_MERGERS.map(u => u.toLowerCase()).includes(actor);
            if (authorized) core.info(`Authorized merge by @${context.actor} ✅`);
            core.setOutput('authorized', authorized ? 'yes' : 'no');

      - name: Checkout env/test
        if: steps.check.outputs.authorized == 'no'
        uses: actions/checkout@v4
        with:
          ref: env/test
          fetch-depth: 0

      - name: Attempt automatic revert
        if: steps.check.outputs.authorized == 'no'
        id: revert
        run: |
          set -e
          git config user.name "release-guard[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Merge commit (2 parents) -> revert the merge, keeping parent 1 (pre-merge tip).
          # Otherwise -> revert the exact range of commits that was just pushed.
          if git rev-parse -q --verify "${GITHUB_SHA}^2" >/dev/null 2>&1; then
            git revert --no-edit -m 1 "${GITHUB_SHA}"
          else
            git revert --no-edit "${{ github.event.before }}..${GITHUB_SHA}"
          fi

          git push origin HEAD:env/test
          echo "reverted=yes" >> "$GITHUB_OUTPUT"

      - name: Handle revert conflict
        if: steps.check.outputs.authorized == 'no' && failure()
        run: git revert --abort || true

      - name: Open alert issue
        if: steps.check.outputs.authorized == 'no' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const reverted = '${{ steps.revert.outputs.reverted }}' === 'yes';
            const title = reverted
              ? `⚠️ Unauthorized merge to env/test auto-reverted (@${context.actor})`
              : `⛔ Unauthorized merge to env/test — MANUAL revert needed (@${context.actor})`;
            const body = reverted
              ? `Commit \`${context.sha}\` on \`env/test\` by @${context.actor} was not from an ` +
                `authorized release manager and has been automatically reverted.`
              : `Commit \`${context.sha}\` on \`env/test\` by @${context.actor} was not from an ` +
                `authorized release manager. The automatic revert could not be applied cleanly ` +
                `(likely a conflict), so **env/test currently contains the unauthorized change** — ` +
                `please revert it manually.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
