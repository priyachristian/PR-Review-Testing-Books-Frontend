name: Guard staging Pushes

# Only authorized users may change the staging branch (it deploys to *.staging.abss.ai).
# If a push/merge to staging is made by anyone else, the change is automatically
# reverted and an alert issue is opened. deploy-staging.yml uses the same list and
# skips the deploy, so the unauthorized change never reaches the server.
#
# Notes:
# - The revert push uses the built-in GITHUB_TOKEN, which does NOT re-trigger workflows,
#   so there is no loop and no deploy of the revert.
# - If the revert cannot be applied cleanly (conflict), nothing is force-pushed; an issue
#   is opened asking for a manual revert instead.
# - This is honest-mistake prevention, not a hard block: anyone with write access can
#   disable this workflow. For a true block, use a Ruleset (paid on private repos).
# - Keep AUTHORIZED_USERS in sync with the allow-list in deploy-staging.yml.

on:
  push:
    branches:
      - staging

permissions:
  contents: write
  issues: write

concurrency:
  group: guard-staging
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the push is by an authorized user
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const AUTHORIZED_USERS = [
              'smit9313',
              'harsh-abss',
            ];
            const actor = context.actor.toLowerCase();
            const authorized = AUTHORIZED_USERS.map(u => u.toLowerCase()).includes(actor);
            if (authorized) core.info(`Authorized push by @${context.actor} ✅`);
            core.setOutput('authorized', authorized ? 'yes' : 'no');

      - name: Checkout staging
        if: steps.check.outputs.authorized == 'no'
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Attempt automatic revert
        if: steps.check.outputs.authorized == 'no'
        id: revert
        run: |
          set -e
          git config user.name "release-guard[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Merge commit (2 parents) -> revert the merge, keeping parent 1 (pre-merge tip).
          # Otherwise -> revert the exact range of commits that was just pushed.
          if git rev-parse -q --verify "${GITHUB_SHA}^2" >/dev/null 2>&1; then
            git revert --no-edit -m 1 "${GITHUB_SHA}"
          else
            git revert --no-edit "${{ github.event.before }}..${GITHUB_SHA}"
          fi

          git push origin HEAD:staging
          echo "reverted=yes" >> "$GITHUB_OUTPUT"

      - name: Handle revert conflict
        if: steps.check.outputs.authorized == 'no' && failure()
        run: git revert --abort || true

      - name: Open alert issue
        if: steps.check.outputs.authorized == 'no' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const reverted = '${{ steps.revert.outputs.reverted }}' === 'yes';
            const title = reverted
              ? `⚠️ Unauthorized push to staging auto-reverted (@${context.actor})`
              : `⛔ Unauthorized push to staging — MANUAL revert needed (@${context.actor})`;
            const body = reverted
              ? `Commit \`${context.sha}\` on \`staging\` by @${context.actor} was not from an ` +
                `authorized user and has been automatically reverted. It was not deployed.`
              : `Commit \`${context.sha}\` on \`staging\` by @${context.actor} was not from an ` +
                `authorized user. The automatic revert could not be applied cleanly ` +
                `(likely a conflict), so **staging currently contains the unauthorized change** — ` +
                `please revert it manually before the next deploy.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
