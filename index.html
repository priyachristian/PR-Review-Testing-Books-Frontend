<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="ABSS Books - Web application" />
    <title>ABSS Books</title>

    <!-- Preconnect to Google Fonts to eliminate DNS/TLS round-trip delay -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />

    <!-- Light & Dark Theme Favicons -->
    <link rel="icon" href="/ABSS Logo Dark.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/ABSS Logo Light.svg" media="(prefers-color-scheme: dark)" />

    <!--  Light & Dark Theme Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/ABSS Logo Dark.svg" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/ABSS Logo Light.svg" media="(prefers-color-scheme: dark)" />

    <!-- Fallback Icon -->
    <link rel="shortcut icon" href="/AppIcon.png" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
